<svg xmlns="http://www.w3.org/2000/svg" width="200" height="120" viewBox="0 0 200 120" fill="none">
  <defs>
    <!-- 3D Cylindrical Pink Candy Gradients -->
    <linearGradient id="pink_body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE4EC"/>
      <stop offset="25%" stop-color="#FFBAC3"/>
      <stop offset="70%" stop-color="#F28299"/>
      <stop offset="100%" stop-color="#C44865"/>
    </linearGradient>

    <linearGradient id="pink_twist_left" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#D95A77"/>
      <stop offset="50%" stop-color="#FFBAC3"/>
      <stop offset="100%" stop-color="#E86A82"/>
    </linearGradient>

    <linearGradient id="pink_twist_right" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#D95A77"/>
      <stop offset="50%" stop-color="#FFBAC3"/>
      <stop offset="100%" stop-color="#E86A82"/>
    </linearGradient>

    <filter id="candy_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#C44865" flood-opacity="0.45"/>
    </filter>

    <filter id="text_glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#FF4581" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- BIG BOLD NUMBER FLOATING CENTERED DIRECTLY ON TOP -->
  <g filter="url(#text_glow)">
    <text x="100" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Arial Black', sans-serif" font-size="32" font-weight="900" fill="#FF85A1" text-anchor="middle" dominant-baseline="central">14</text>
  </g>

  <!-- 3D CANDY WRAPPER WITH OG TITLE (CURRENT STREAK) -->
  <g filter="url(#candy_glow)">
    <g transform="translate(0, 56)">
      <!-- LEFT TWISTED FAN WRAPPER END -->
      <g>
        <path d="M 32 26 C 24 16 14 6 4 10 C 2 18 6 34 4 42 C 14 46 24 36 32 26 Z" fill="url(#pink_twist_left)"/>
        <path d="M 32 26 C 26 18 16 12 8 14 C 12 24 16 32 32 26 Z" fill="#FFFFFF" opacity="0.3"/>
        <path d="M 32 26 C 24 28 14 36 6 38 C 10 32 18 24 32 26 Z" fill="#992B45" opacity="0.25"/>
      </g>

      <!-- RIGHT TWISTED FAN WRAPPER END -->
      <g>
        <path d="M 168 26 C 176 16 186 6 196 10 C 198 18 194 34 196 42 C 186 46 176 36 168 26 Z" fill="url(#pink_twist_right)"/>
        <path d="M 168 26 C 174 18 184 12 192 14 C 188 24 184 32 168 26 Z" fill="#FFFFFF" opacity="0.3"/>
        <path d="M 168 26 C 176 28 186 36 194 38 C 190 32 182 24 168 26 Z" fill="#992B45" opacity="0.25"/>
      </g>

      <!-- MAIN 3D CANDY CYLINDER BODY -->
      <rect x="28" y="8" width="144" height="36" rx="14" fill="url(#pink_body)"/>
      
      <!-- PINCHED TWIST KNOT ACCENTS -->
      <ellipse cx="30" cy="26" rx="3.5" ry="12" fill="#D95A77"/>
      <ellipse cx="170" cy="26" rx="3.5" ry="12" fill="#D95A77"/>

      <!-- GLOSSY SPECULAR HIGHLIGHT REFLECTION -->
      <path d="M 38 12 L 162 12 C 166 12 166 16 162 16 L 38 16 Z" fill="#FFFFFF" opacity="0.55"/>

      <!-- OG TITLE STAMPED INSIDE CANDY WRAPPER -->
      <text x="100" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Arial Black', sans-serif" font-size="10.5" font-weight="900" fill="#7A1D33" text-anchor="middle" dominant-baseline="central" letter-spacing="0.7">CURRENT STREAK</text>
    </g>
  </g>
</svg>
