    @keyframes beat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.18); } 30% { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .line, .heart { animation: none; stroke-dashoffset: 0; opacity: 1; } }
  </style>
